<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Argos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="janela">
    <aside class="lateral">
      <div class="lateral-topo pywebview-drag-region">
        <div class="semaforos" id="semaforos">
          <button class="s vermelho" data-acao="jan-fechar" aria-label="Fechar"><svg viewBox="0 0 10 10"><path d="M3 3l4 4M7 3l-4 4"/></svg></button>
          <button class="s amarelo" data-acao="jan-minimizar" aria-label="Minimizar"><svg viewBox="0 0 10 10"><path d="M2.5 5h5"/></svg></button>
          <button class="s verde" data-acao="jan-maximizar" aria-label="Maximizar"><svg viewBox="0 0 10 10"><path d="M3 3h3.2L3 6.2zM7 7H3.8L7 3.8z" class="cheio"/></svg></button>
        </div>
      </div>
      <nav class="menu" id="menu"></nav>
      <div class="lateral-rodape">
        <div class="estado-docker" id="estado-docker"></div>
        <button class="ib" data-acao="config" title="Configurações" aria-label="Configurações" id="btn-config"></button>
      </div>
    </aside>

    <div class="principal">
      <header class="barra pywebview-drag-region" id="barra">
        <div class="barra-titulo">
          <h1 id="titulo">Rodando</h1>
          <span class="barra-sub" id="subtitulo"></span>
        </div>
        <div class="barra-acoes" id="barra-acoes"></div>
      </header>
      <main id="conteudo">
        <section data-painel="rodando" id="p-rodando"></section>
        <section data-painel="projetos" id="p-projetos" hidden></section>
        <section data-painel="docker" id="p-docker" hidden></section>
        <section data-painel="ferramentas" id="p-ferramentas" hidden></section>
        <section data-painel="hoje" id="p-hoje" hidden></section>
      </main>
    </div>
  </div>


  <div class="fundo" id="fundo" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>

  <div class="redim direita" data-redim="e"></div>
  <div class="redim baixo" data-redim="s"></div>
  <div class="redim canto" data-redim="se"></div>

  <script src="dica.js"></script>
  <script src="base.js"></script>
  <script src="rodando.js"></script>
  <script src="projetos.js"></script>
  <script src="docker.js"></script>
  <script src="hoje.js"></script>
  <script src="logs.js"></script>
  <script src="dialogos.js"></script>
  <script src="acoes.js"></script>
  <script src="paleta.js"></script>
  <script src="inicio.js"></script>
</body>
</html>
