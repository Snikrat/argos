[project]
name = "argos"
version = "1.4.0"
description = "Painel do que está rodando de desenvolvimento: Docker, portas e processos."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "psutil>=6.0",
    "pystray>=0.19",
    "pillow>=10.0",
    "pywebview>=5.0",
    "segno>=1.6",
]

[project.scripts]
argos = "argos.cli:main"

[project.gui-scripts]
argos-app = "argos.app.principal:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
